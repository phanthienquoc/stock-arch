services:
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  order-core:
    image: ${ORDER_CORE_IMAGE}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  order-state:
    image: ${ORDER_STATE_IMAGE}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  risk-engine:
    image: ${RISK_ENGINE_IMAGE}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tp-sl-engine:
    image: ${TPSL_ENGINE_IMAGE}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notify-service:
    image: ${NOTIFY_SERVICE_IMAGE}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
