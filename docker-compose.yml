version: "3.9"

services:
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  order-core:
    image: alexanderloveiris/order-core@${ORDER_CORE_DIGEST}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  order-state:
    image: alexanderloveiris/order-state@${ORDER_STATE_DIGEST}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  risk-engine:
    image: alexanderloveiris/risk-engine@${RISK_ENGINE_DIGEST}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tp-sl-engine:
    image: alexanderloveiris/tp-sl-engine@${TPSL_ENGINE_DIGEST}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notify-service:
    image: alexanderloveiris/notify-service@${NOTIFY_DIGEST}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
