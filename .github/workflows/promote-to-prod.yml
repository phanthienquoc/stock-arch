name: Manual Deployment to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # enable approval here

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get image digests
        id: digests
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          ORDER_CORE=$(docker inspect --format='{{index .RepoDigests 0}}' \
            alexanderloveiris/order-core:${VERSION#v} 2>/dev/null || echo "alexanderloveiris/order-core:${VERSION#v}")
          ORDER_STATE=$(docker inspect --format='{{index .RepoDigests 0}}' \
            alexanderloveiris/order-state:${VERSION#v} 2>/dev/null || echo "alexanderloveiris/order-state:${VERSION#v}")
          RISK_ENGINE=$(docker inspect --format='{{index .RepoDigests 0}}' \
            alexanderloveiris/risk-engine:${VERSION#v} 2>/dev/null || echo "alexanderloveiris/risk-engine:${VERSION#v}")
          TPSL_ENGINE=$(docker inspect --format='{{index .RepoDigests 0}}' \
            alexanderloveiris/tp-sl-engine:${VERSION#v} 2>/dev/null || echo "alexanderloveiris/tp-sl-engine:${VERSION#v}")
          NOTIFY=$(docker inspect --format='{{index .RepoDigests 0}}' \
            alexanderloveiris/notify-service:${VERSION#v} 2>/dev/null || echo "alexanderloveiris/notify-service:${VERSION#v}")
          
          echo "ORDER_CORE_DIGEST=${ORDER_CORE}" >> $GITHUB_OUTPUT
          echo "ORDER_STATE_DIGEST=${ORDER_STATE}" >> $GITHUB_OUTPUT
          echo "RISK_ENGINE_DIGEST=${RISK_ENGINE}" >> $GITHUB_OUTPUT
          echo "TPSL_ENGINE_DIGEST=${TPSL_ENGINE}" >> $GITHUB_OUTPUT
          echo "NOTIFY_DIGEST=${NOTIFY}" >> $GITHUB_OUTPUT

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/trading || exit 1
            
            # Update .env with new digests
            sed -i "s|ORDER_CORE_DIGEST=.*|ORDER_CORE_DIGEST=${{ steps.digests.outputs.ORDER_CORE_DIGEST }}|g" .env.prod
            sed -i "s|ORDER_STATE_DIGEST=.*|ORDER_STATE_DIGEST=${{ steps.digests.outputs.ORDER_STATE_DIGEST }}|g" .env.prod
            sed -i "s|RISK_ENGINE_DIGEST=.*|RISK_ENGINE_DIGEST=${{ steps.digests.outputs.RISK_ENGINE_DIGEST }}|g" .env.prod
            sed -i "s|TPSL_ENGINE_DIGEST=.*|TPSL_ENGINE_DIGEST=${{ steps.digests.outputs.TPSL_ENGINE_DIGEST }}|g" .env.prod
            sed -i "s|NOTIFY_DIGEST=.*|NOTIFY_DIGEST=${{ steps.digests.outputs.NOTIFY_DIGEST }}|g" .env.prod
            
            # Pull latest images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed!"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Environment: Production"