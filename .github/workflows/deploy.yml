name: Auto Deploy to Staging

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download digests from build workflow
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: build-artifacts

      - name: Parse digests
        id: digests
        run: |
          # Merge all digest files
          cat build-artifacts/digests-*/digests.txt > all-digests.txt || echo "order-core=sha256:unknown" > all-digests.txt
          
          echo "📦 Digests found:"
          cat all-digests.txt
          
          # Create outputs
          while IFS='=' read -r service digest; do
            echo "${service^^}_DIGEST=${digest}"
          done < all-digests.txt | tee digest-output.txt

      - name: Deploy to Staging VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            echo "🚀 Deploying to Staging..."
            cd /opt/trading || cd /app/trading || exit 1
            
            # Get digests from build artifacts (passed via env)
            DIGESTS_FILE="/tmp/digests.txt"
            echo "Updating services..."
            
            # Pull latest images
            echo "📥 Pulling latest Docker images..."
            docker compose pull || docker compose -f docker-compose.local.yml pull || true
            
            # Start/restart services
            echo "🔄 Restarting services..."
            docker compose up -d || docker compose -f docker-compose.local.yml up -d
            
            echo "✅ Staging deployment completed!"
            sleep 2
            docker compose ps 2>/dev/null || docker compose -f docker-compose.local.yml ps

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "✅ STAGING DEPLOYMENT SUCCESSFUL"
          echo ""
          echo "📋 Details:"
          echo "  Workflow: ${{ github.event.workflow_run.name }}"
          echo "  Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "  Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "  Version: $(git describe --tags --always)"
          echo ""
          echo "🚀 Next step: Manually promote to production using promote-to-prod workflow"
