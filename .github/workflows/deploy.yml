name: Auto Deploy Staging

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Extract tag
        run: |
          echo "VERSION=${{ github.event.workflow_run.head_commit.message }}" >> $GITHUB_ENV

      - name: Resolve digests
        run: |
          echo "ORDER_CORE_DIGEST=$(docker buildx imagetools inspect alexanderloveiris/order-core:${VERSION} --format '{{.Digest}}')" >> $GITHUB_ENV
          echo "ORDER_STATE_DIGEST=$(docker buildx imagetools inspect alexanderloveiris/order-state:${VERSION} --format '{{.Digest}}')" >> $GITHUB_ENV
          echo "RISK_ENGINE_DIGEST=$(docker buildx imagetools inspect alexanderloveiris/risk-engine:${VERSION} --format '{{.Digest}}')" >> $GITHUB_ENV
          echo "TPSL_ENGINE_DIGEST=$(docker buildx imagetools inspect alexanderloveiris/tp-sl-engine:${VERSION} --format '{{.Digest}}')" >> $GITHUB_ENV
          echo "NOTIFY_DIGEST=$(docker buildx imagetools inspect alexanderloveiris/notify-service:${VERSION} --format '{{.Digest}}')" >> $GITHUB_ENV

      - name: Deploy STAGING
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/trading
            sed -i "s|ORDER_CORE_DIGEST=.*|ORDER_CORE_DIGEST=${ORDER_CORE_DIGEST}|" .env.prod
            sed -i "s|ORDER_STATE_DIGEST=.*|ORDER_STATE_DIGEST=${ORDER_STATE_DIGEST}|" .env.prod
            sed -i "s|RISK_ENGINE_DIGEST=.*|RISK_ENGINE_DIGEST=${RISK_ENGINE_DIGEST}|" .env.prod
            sed -i "s|TPSL_ENGINE_DIGEST=.*|TPSL_ENGINE_DIGEST=${TPSL_ENGINE_DIGEST}|" .env.prod
            sed -i "s|NOTIFY_DIGEST=.*|NOTIFY_DIGEST=${NOTIFY_DIGEST}|" .env.prod
            docker compose pull
            docker compose up -d
