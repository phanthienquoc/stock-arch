name: Build & Push Images

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: alexanderloveiris

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    outputs:
      order_core_digest: ${{ steps.digest.outputs.order_core }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push order-core
        uses: docker/build-push-action@v5
        with:
          context: ./order-core
          push: true
          tags: |
            alexanderloveiris/order-core:${{ steps.vars.outputs.VERSION }}

      - name: Get image digest
        id: digest
        run: |
          echo "order_core=$(docker buildx imagetools inspect \
            alexanderloveiris/order-core:${{ steps.vars.outputs.VERSION }} \
            --format '{{ (index .Manifests 0).Digest }}')" >> $GITHUB_OUTPUT
