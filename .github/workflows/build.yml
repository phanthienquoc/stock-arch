name: Build & Push Images

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: alexanderloveiris

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    strategy:
      matrix:
        service:
          - name: order-core
            path: order-core
          - name: order-state
            path: order-state
          - name: risk-engine
            path: risk-engine
          - name: tp-sl-engine
            path: tp-sl-engine
          - name: notify-service
            path: notify-service

    outputs:
      digests: ${{ steps.collect.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          push: true
          tags: |
            alexanderloveiris/${{ matrix.service.name }}:${{ steps.vars.outputs.VERSION }}

      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker manifest inspect \
            alexanderloveiris/${{ matrix.service.name }}:${{ steps.vars.outputs.VERSION }} \
            | jq -r '.manifests[0].digest' 2>/dev/null || echo "sha256:unknown")
          
          echo "DIGEST=$DIGEST" >> $GITHUB_OUTPUT
          echo "${{ matrix.service.name }}=${DIGEST}" >> digests.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service.name }}
          path: digests.txt
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: digests-artifacts

      - name: Merge digests
        run: |
          cat digests-artifacts/digests-*/digests.txt > all-digests.txt
          echo "=== Collected Digests ===" 
          cat all-digests.txt

      - name: Create digest output
        id: digests
        run: |
          # Create environment variables for each service digest
          while IFS='=' read -r service digest; do
            echo "${service^^}_DIGEST=${digest}" >> $GITHUB_OUTPUT
          done < all-digests.txt
          
          cat all-digests.txt

      - name: Deploy notification
        run: |
          echo "🎉 Build completed successfully!"
          echo "Services: order-core, order-state, risk-engine, tp-sl-engine, notify-service"
          echo "Version: ${{ github.ref_name }}"
